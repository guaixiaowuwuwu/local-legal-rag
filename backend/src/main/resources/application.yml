server:
  port: 8080

spring:
  application:
    name: legal-rag-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legal_rag}
    username: ${SPRING_DATASOURCE_USERNAME:legal_rag}
    password: ${SPRING_DATASOURCE_PASSWORD:legal_rag}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL:text-embedding-3-small}

management:
  endpoints:
    web:
      exposure:
        include: health,info

legal-rag:
  upload-dir: ${LEGAL_RAG_UPLOAD_DIR:storage/uploads}
  chunk-size: ${LEGAL_RAG_CHUNK_SIZE:900}
  chunk-overlap: ${LEGAL_RAG_CHUNK_OVERLAP:120}
  top-k: ${LEGAL_RAG_TOP_K:5}
  min-score: ${LEGAL_RAG_MIN_SCORE:0.0}
  embedding-dimensions: ${SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS:1536}
